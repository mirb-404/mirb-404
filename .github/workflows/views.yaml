name: Refresh profile views

on:
  schedule: # once a day, just after midnight UTC
    - cron: "7 0 * * *"
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: rebuild assets with the latest count
        run: node make_banner.js

      - name: commit if the count changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/views.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile views"
          git push
